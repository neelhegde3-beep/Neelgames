<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quest of the Forgotten Realms</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <h1>Quest of the Forgotten Realms</h1>
    <div id="stats">
      <p>❤️ Health: <span id="health">100</span></p>
      <p>🔮 Mana: <span id="mana">50</span></p>
      <p>💰 Gold: <span id="gold">0</span></p>
    </div>
    <div id="location"></div>
    <div id="story"></div>
    <div id="choices"></div>
    <div id="inventory">
      <h3>🎒 Inventory</h3>
      <ul id="items"></ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
